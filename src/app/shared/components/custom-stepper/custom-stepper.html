<!-- Desktop / Tablet -->
<div
  #stickyHeader
  class="hidden sm:block"
  [class.fixed]="isSticky"
  [class.top-0]="isSticky"
  [class.left-0]="isSticky"
  [class.right-0]="isSticky"
  [class.bg-white]="isSticky"
  [class.z-50]="isSticky"
  [class.mb-3]="!isSticky"
  [class.p-3]="isSticky"
  [class.shadow-md]="isSticky"
  [class.border-b]="isSticky"
  [class.top-8]="!isHideHeader"
>
  <div class="relative flex w-full items-start">

    <!-- Background line -->
    <div
      class="absolute left-[10%] right-[10%] top-7 h-0.5 bg-gray-300 z-0"
    ></div>

    <!-- Progress line -->
    <div
      class="absolute left-[10%] top-7 h-0.5 bg-gray-700 z-0 transition-all duration-300"
      [style.width.%]="getProgressWidth()"
    ></div>

    @for (step of stepsArray; track step.id(); let i = $index) {

      <div
        class="relative z-10 flex min-w-0 flex-1 flex-col items-center"
        [class.cursor-pointer]="!step.disabled()"
        [class.opacity-50]="step.disabled()"
        (click)="goToStep(i)"
      >

        <!-- Circle -->
        <button
          type="button"
          class="
            flex h-14 w-14
            items-center justify-center
            rounded-full
            border-4 border-white
            text-white
            shadow-sm
            transition-all duration-200
            hover:scale-105
          "
          [class.ring-2]="currentStepIndex === i"
          [class.ring-gray-400]="currentStepIndex === i"
          [style.background-color]="getStepColor(i)"
          [disabled]="step.disabled()"
        >

          @if (step.showIcon()) {

            @let icon = getIcon(step.iconName());

            @if (icon) {

              <svg
                [attr.xmlns]="icon.xmlns"
                [attr.fill]="icon.fill"
                [attr.viewBox]="icon.viewBox"
                [attr.stroke]="icon.stroke"
                [attr.stroke-width]="icon.strokeWidth"
                [ngClass]="icon.class"
              >
                <path
                  [attr.d]="icon.path"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

            }

          }

        </button>

        <!-- Label -->
        <div
          class="
            mt-2
            max-w-[150px]
            truncate
            text-center
            text-sm
            text-gray-700
          "
          [class.font-semibold]="currentStepIndex === i"
          [class.text-black]="currentStepIndex === i"
        >
          {{ step.label() }}
        </div>

      </div>

    }

    

  </div>
</div>
