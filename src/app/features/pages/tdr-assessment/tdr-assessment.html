<div class="w-full space-y-4 mt-4">

  <div class=text-center>
    <span class="text-xl font-bold text-blue-800">
      แบบฟอร์มพิจารณาปรับโครงสร้างหนี้
    </span>
  </div>

  <div>
    @if (errorMessage()) {

    <app-data-load-error [errorMessage]="errorMessage() ?? 'Not found error.'" />

    }
    @else if (isLoaded()) {

    <app-custom-stepper [(currentStepIndex)]="currentStepIndex" [stepDefaultColor]="'#d1d5db'"
      [stepValidColor]="'#374151'" [stepInvalidColor]="'#374151'" [stepCurrentColor]="'#000000'"
      (stepIndexChange)="onStepChange($event)">


      <!-- ===================================================== -->
      <!-- Step 1: Customer (ข้อมูลลูกค้า)                           -->
      <!-- ===================================================== -->

      <app-step id="customer" label="ข้อมูลลูกค้า" iconName="user" [showIcon]="true" [valid]="customerValid"
        [visited]="customerVisited">

        <!-- <ng-template> -->
        <app-customer-information-step></app-customer-information-step>
        <!-- </ng-template> -->

      </app-step>


      <!-- ===================================================== -->
      <!-- Step 2: Loan Information   (ข้อมูลผลิดภัณฑ์เช่าช์้อ)        -->
      <!-- ===================================================== -->

      <app-step id="loan" label="ข้อมูลผลิดภัณฑ์เช่าช์้อ" iconName="identification" [showIcon]="true"
        [valid]="loanValid" [visited]="loanVisited">

        <app-product-information-step [form]="form" [motorcyclePhotoTypes]="motorcyclePhotoTypesDisplay()" />

      </app-step>


      <!-- ===================================================== -->
      <!-- Step 3: Financial Assessment	การประเมินรายได้ (รวมต่อเดือน) -->
      <!-- ===================================================== -->

      <app-step id="financial" label="Financial Assessment" iconName="briefcase" [showIcon]="true"
        [valid]="financialValid" [visited]="financialVisited">

        <ng-template>

          <div class="p-4">

            <h2 class="
              mb-4
              text-lg
              font-semibold
            ">
              Financial Assessment
            </h2>


            <p class="text-gray-600">

              Financial assessment form will be here.

            </p>

          </div>

        </ng-template>

      </app-step>


      <!-- ===================================================== -->
      <!-- Step 4: Documents  การประเมินค่าใช้จ่าย (รวมต่อเดือน)        -->
      <!-- ===================================================== -->

      <app-step id="document" label="Documents" iconName="clipboard-document" [showIcon]="true" [valid]="documentValid"
        [visited]="documentVisited">

        <ng-template>

          <div class="p-4">

            <h2 class="
              mb-4
              text-lg
              font-semibold
            ">
              Document Information
            </h2>


            <p class="text-gray-600">

              Document form will be here.

            </p>

          </div>

        </ng-template>

      </app-step>


      <!-- ===================================================== -->
      <!-- Step 5: Reason	เหตุผลและความจำเป็นในการขอปรับโครงสร้างหนี้  -->
      <!-- ===================================================== -->

      <app-step id="summary" label="Summary" iconName="newspaper" [showIcon]="true" [valid]="summaryValid"
        [visited]="summaryVisited">

        <ng-template>

          <div class="p-4">

            <h2 class="
              mb-4
              text-lg
              font-semibold
            ">
              Summary
            </h2>


            <p class="text-gray-600">

              Summary will be here.

            </p>

          </div>

        </ng-template>

      </app-step>


    </app-custom-stepper>

    }
    @else if (isLoading()) {
    <div class="flex min-h-80 w-full items-center justify-center">

      <div class="flex flex-col items-center gap-4">

        <z-spinner class="size-8" />

        <span class="text-sm text-gray-500">
          กำลังโหลดข้อมูล...
        </span>

      </div>

    </div>

    }
  </div>

</div>
