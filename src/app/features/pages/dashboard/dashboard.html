<section class="relative flex min-h-screen items-center justify-center overflow-hidden p-4 sm:p-6">
  <!-- decorative background -->
  <div
    class="bg-grid pointer-events-none absolute inset-0 text-foreground"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -left-24 top-1/4 size-[360px] rounded-full blur-3xl"
    style="background: color-mix(in oklab, var(--brand-blue) 14%, transparent)"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -right-24 bottom-1/4 size-[360px] rounded-full blur-3xl"
    style="background: color-mix(in oklab, var(--brand-green) 16%, transparent)"
    aria-hidden="true"
  ></div>

  <!-- language switch -->
  <!-- <div
    class="absolute right-4 top-4 z-10 flex gap-1 rounded-lg border bg-card/80 p-1 backdrop-blur sm:right-6 sm:top-6"
  >
    @for (l of languages; track l.code) {
      <button
        z-button
        type="button"
        zSize="sm"
        [zType]="langService.lang() === l.code ? 'default' : 'ghost'"
        (click)="langService.set(l.code)"
      >
        {{ l.label }}
      </button>
    }
  </div> -->

  <div class="enter relative flex w-full max-w-xl flex-col items-center gap-8">
    <!-- hero -->
    <div class="flex flex-col items-center gap-4 text-center">
      <img
        [src]="branding.logoSrc"
        [alt]="branding.name"
        class="float size-32 object-contain drop-shadow-md sm:size-36"
        width="144"
        height="144"
      />
      <div class="space-y-1">
        <h1
          class="bg-clip-text text-4xl font-extrabold tracking-tight text-transparent sm:text-5xl"
          style="
            background-image: linear-gradient(
              135deg,
              var(--brand-blue) 20%,
              var(--brand-green) 90%
            );
          "
        >
          {{ t().welcome }}
        </h1>
        <p class="text-sm text-muted-foreground sm:text-base">{{ t().subtitle }}</p>
      </div>
    </div>

    <!-- main action card -->
    <z-card class="card-lift w-full pt-0 shadow-xl [--card-spacing:--spacing(6)]">
      <!-- two-tone accent bar (echoes the logo underline) -->
      <div
        class="h-1.5 w-full"
        style="background: linear-gradient(to right, var(--brand-blue) 50%, var(--brand-green) 50%)"
        aria-hidden="true"
      ></div>

      <z-card-header class="pt-[--card-spacing]">
        <z-card-title [zTitle]="t().tdrTitle" class="text-lg" />
        <z-card-description [zDescription]="t().tdrDescription" />
        <z-card-action>
          <div
            class="flex size-12 items-center justify-center rounded-xl"
            style="
              background: color-mix(in oklab, var(--brand-green) 15%, transparent);
              color: var(--brand-green);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-6"
              aria-hidden="true"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <path d="M14 2v6h6" />
              <path d="M8 13h8M8 17h5" />
            </svg>
          </div>
        </z-card-action>
      </z-card-header>

      <z-card-footer>
        <a z-button [routerLink]="tdrLink" class="w-full gap-2">
          {{ t().tdrButton }}
          <span aria-hidden="true">→</span>
        </a>
      </z-card-footer>
    </z-card>
  </div>
</section>
