<section class="relative flex min-h-screen items-center justify-center overflow-hidden p-4 sm:p-6">
  <!-- decorative background -->
  <div
    class="bg-grid pointer-events-none absolute inset-0 text-foreground"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -left-24 top-1/4 size-[360px] rounded-full blur-3xl"
    style="background: color-mix(in oklab, var(--brand-blue) 14%, transparent)"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -right-24 bottom-1/4 size-[360px] rounded-full blur-3xl"
    style="background: color-mix(in oklab, var(--brand-green) 16%, transparent)"
    aria-hidden="true"
  ></div>

  <!-- language switch -->
  <!-- <div
    class="absolute right-4 top-4 z-10 flex gap-1 rounded-lg border bg-card/80 p-1 backdrop-blur sm:right-6 sm:top-6"
  >
    @for (l of languages; track l.code) {
      <button
        z-button
        type="button"
        zSize="sm"
        [zType]="langService.lang() === l.code ? 'default' : 'ghost'"
        (click)="langService.set(l.code)"
      >
        {{ l.label }}
      </button>
    }
  </div> -->

  <z-card class="enter relative w-full max-w-lg pt-0 shadow-xl [--card-spacing:--spacing(8)]">
    <!-- two-tone accent bar (echoes the logo underline) -->
    <div
      class="h-1.5 w-full"
      style="background: linear-gradient(to right, var(--brand-blue) 50%, var(--brand-green) 50%)"
      aria-hidden="true"
    ></div>

    <z-card-content class="pt-[--card-spacing]">
      <div class="flex flex-col items-center gap-6 text-center">
        <!-- logo -->
        <img
          [src]="branding.logoSrc"
          [alt]="branding.name"
          class="float size-28 object-contain drop-shadow-md sm:size-32"
          width="128"
          height="128"
        />

        <!-- 404 -->
        <div class="space-y-1">
          <p class="text-xs font-semibold uppercase tracking-[0.25em] text-muted-foreground">
            {{ t().code }}
          </p>
          <h1
            class="bg-clip-text text-7xl font-extrabold leading-none tracking-tight text-transparent sm:text-8xl"
            style="
              background-image: linear-gradient(
                135deg,
                var(--brand-blue) 20%,
                var(--brand-green) 90%
              );
            "
          >
            404
          </h1>
        </div>

        <!-- message -->
        <div class="space-y-2">
          <h2 class="text-xl font-semibold tracking-tight sm:text-2xl">{{ t().title }}</h2>
          <p class="mx-auto max-w-sm text-sm text-muted-foreground">{{ t().description }}</p>
        </div>

        <p class="text-xs text-muted-foreground">{{ t().help }}</p>
      </div>
    </z-card-content>

    <z-card-footer zFooterBorder class="flex-col-reverse justify-center gap-3 sm:flex-row">
      <button z-button zType="outline" type="button" class="w-full sm:w-auto" (click)="goBack()">
        ← {{ t().back }}
      </button>
      <a z-button [routerLink]="homeLink" class="w-full sm:w-auto">{{ t().home }}</a>
    </z-card-footer>
  </z-card>
</section>
